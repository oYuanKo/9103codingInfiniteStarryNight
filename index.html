<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Infinite Starry Night</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
</head>

<body>
  <main id="presentation" aria-label="Infinite Starry Night">
    <div id="artwork"></div>
    <footer id="presentation-guide">
      <button id="help-toggle" type="button" aria-controls="painting-help" aria-expanded="true">Hide guide</button>
      <p id="painting-help">Move through the painted sky. Hover over a major star or the moon to awaken its light.<br>
        Scroll to explore; keep zooming into a star or moon to enter another universe. Reverse scrolling to return.</p>
    </footer>
  </main>
  <script src="artwork.js"></script>

  <script src="brush_detail_v2.js"></script>
  <script src="brush_renderer_v2.js"></script>
  <script src="brush_flow_shader.js"></script>

  <script src="zoom_camera.js"></script>
  <script src="nested_universe_v2.js"></script>
  
  <script src="star_hover_light_v2.js"></script>
  <script src="group_bridge.js"></script>
  <script src="ui_overlay.js"></script>
  <script src="app_controller.js"></script>
  <script src="input_controller.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
